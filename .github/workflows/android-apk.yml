name: Build EGG FIRE Android APK (Godot 4)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Download Godot 4.3 and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Prepare original user images without editing them
        run: |
          mkdir -p godot/assets app/build/outputs/apk/debug
          cp app/src/main/file_000000002b60820e9b3b90c83315eeed.png godot/assets/lobby.png
          cp app/src/main/file_0000000090f8820e959f5ac390ae6590.png godot/assets/character.png
          test -s godot/assets/lobby.png
          test -s godot/assets/character.png

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate Godot project
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Export Android APK
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/EGG-FIRE.apk"
          test -s app/build/outputs/apk/debug/EGG-FIRE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EGG-FIRE-GODOT-APK
          path: app/build/outputs/apk/debug/EGG-FIRE.apk
          if-no-files-found: error
          retention-days: 30
