<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>EGG FIRE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07152f}body{font-family:system-ui,Arial,sans-serif;touch-action:manipulation}
#lobby{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#315d91,#07152f 85%)}
#scene{position:absolute;width:100%;height:100%;inset:0;display:block;object-fit:fill}
#vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#06142b25 0%,transparent 35%,#06142b20 70%,#06142b55 100%);box-shadow:inset 0 0 90px #06142b66}
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;top:-8%;width:11px;height:16px;border-radius:85% 15% 80% 20%;background:linear-gradient(135deg,#ffe2f1,#ff83c4);box-shadow:0 0 9px #ffacd966;opacity:.88;animation:fall var(--duration) linear var(--delay) infinite;left:var(--left);transform:rotate(var(--angle))}
@keyframes fall{0%{translate:0 -5vh;rotate:0deg;opacity:0}12%{opacity:.9}50%{translate:var(--drift) 52vh;rotate:220deg}88%{opacity:.85}100%{translate:calc(var(--drift) * -1) 112vh;rotate:520deg;opacity:0}}
.hit{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;gap:clamp(7px,1vw,13px);padding:clamp(9px,1.25vw,17px) clamp(13px,1.8vw,24px);border:1px solid #ffe5a5;border-radius:15px;color:#fff;font-weight:900;letter-spacing:.7px;font-size:clamp(11px,1.25vw,17px);text-shadow:0 2px 4px #321b17;background:linear-gradient(180deg,#f7bd58 0%,#c45a27 48%,#7b2630 100%);box-shadow:0 5px 0 #421b2a,0 10px 24px #06152b99,inset 0 1px 0 #fff9;cursor:pointer;transition:filter .16s,transform .16s; -webkit-tap-highlight-color:transparent}
.hit .symbol{display:grid;place-items:center;width:clamp(23px,2.4vw,32px);height:clamp(23px,2.4vw,32px);border-radius:9px;background:#fff2;color:#fff;font-size:clamp(17px,2vw,25px);line-height:1}
.hit:active{filter:brightness(1.2);transform:translateY(3px);box-shadow:0 2px 0 #421b2a,0 5px 12px #06152b99}
.hit:focus-visible{outline:3px solid #fff;outline-offset:4px}
#profile,#shop{top:3.5%;min-width:clamp(92px,9vw,132px);min-height:clamp(48px,6.5vh,64px)}
#profile{left:2.5%}#shop{left:calc(2.5% + clamp(100px,10vw,145px))}
#characters{left:2.5%;bottom:4.5%;min-height:clamp(52px,7vh,70px);min-width:clamp(150px,19vw,245px)}
#start{right:2.5%;bottom:4.5%;min-height:clamp(58px,8vh,78px);min-width:clamp(165px,21vw,270px);font-size:clamp(14px,1.7vw,22px);background:linear-gradient(180deg,#ffe58b 0%,#f59a32 48%,#c74b22 100%);border-color:#fff0b4;box-shadow:0 6px 0 #6a281b,0 12px 28px #06152bcc,inset 0 1px 0 #fff}
#start:active{box-shadow:0 2px 0 #6a281b,0 5px 12px #06152b99}
#lobby:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,#07152b55 0%,transparent 23%,transparent 68%,#07152b55 100%)}
@media(max-width:600px){.hit{border-radius:12px;letter-spacing:.2px;padding:8px 10px}#profile,#shop{top:2.5%;min-width:76px;min-height:43px}#profile{left:3%}#shop{left:calc(3% + 83px)}#characters{left:3%;bottom:3%;min-width:132px;min-height:48px}#start{right:3%;bottom:3%;min-width:145px;min-height:54px}}

#status{position:absolute;z-index:5;left:50%;bottom:3%;transform:translate(-50%,150%);padding:11px 18px;border:1px solid #ffffff35;border-radius:14px;background:#101d38ed;color:#fff;font-weight:700;font-size:clamp(12px,1.6vw,17px);text-align:center;max-width:90%;box-shadow:0 8px 28px #0007;transition:transform .25s ease}
#status.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.petal{animation:none;display:none}.hit{transition:none}}

#characters-panel{position:absolute;z-index:8;left:0;top:0;height:100%;width:min(430px,45vw);min-width:280px;padding:clamp(18px,2.5vw,32px);background:linear-gradient(145deg,#07152bf7,#102c4ff5 65%,#07152bf7);border-right:2px solid #f5cf83;box-shadow:18px 0 65px #000b;backdrop-filter:blur(16px);transform:translateX(-105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);color:#fff;display:flex;flex-direction:column;gap:16px}
#characters-panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e8c47c66;padding-bottom:12px}
.panel-title{font-size:clamp(18px,2.4vw,27px);font-weight:900;letter-spacing:1px;color:#ffe2a1;text-shadow:0 2px 10px #0008}
#close-characters{width:36px;height:36px;border:1px solid #f4d49a88;border-radius:10px;background:#ffffff14;color:white;font-size:23px;line-height:1;cursor:pointer}
.panel-subtitle{font-size:clamp(11px,1.3vw,14px);color:#d2e0f2;margin:0}
.character-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:auto;padding:2px 3px 8px}
.character-card{min-height:clamp(140px,23vh,205px);border:1px solid #a9c7e477;border-radius:16px;background:linear-gradient(160deg,#25496de8,#0d1e37f5);color:#fff;padding:12px 9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:.18s}
.character-card.selected{border:2px solid #ffd477;box-shadow:0 0 0 2px #ffd47733,0 0 24px #f4c66b77;background:linear-gradient(160deg,#42678b,#182c48)}
.avatar{height:clamp(65px,12vh,105px);width:100%;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:9px;background:radial-gradient(ellipse at 50% 75%,#8db5d944,transparent 65%)}
.avatar svg{height:100%;max-width:100%;filter:drop-shadow(0 5px 5px #0008)}
.character-name{font-size:clamp(11px,1.35vw,15px);font-weight:800;text-align:center}
.character-state{font-size:10px;color:#c7d8ea}
#selected-character{font-size:13px;font-weight:800;color:#ffe2a1;text-align:center;margin-top:auto;padding:13px 10px;border:1px solid #e8c47c66;border-radius:12px;background:#ffffff0c}
@media(max-width:600px){#characters-panel{width:min(360px,82vw);min-width:0}.character-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="lobby" aria-label="Lobby do EGG FIRE">
<img id="scene" src="lobby.svg" alt="Templo japonês, cerejeiras e montanhas do lobby EGG FIRE">
<div id="vignette"></div><div id="petals" aria-hidden="true"></div>
<button class="hit" id="profile" aria-label="Abrir perfil"><span class="symbol">♙</span><span>PERFIL</span></button>
<button class="hit" id="shop" aria-label="Abrir loja"><span class="symbol">◇</span><span>LOJA</span></button>
<button class="hit" id="characters" aria-label="Ver personagens"><span class="symbol">♟</span><span>PERSONAGENS</span></button>
<button class="hit" id="start" aria-label="Começar partida"><span class="symbol">▶</span><span>COMEÇAR</span></button>
<section id="characters-panel" aria-label="Personagens" aria-hidden="true">
<div class="panel-head"><div class="panel-title">PERSONAGENS</div><button id="close-characters" aria-label="Fechar personagens">×</button></div>
<p class="panel-subtitle">Escolha seu personagem</p>
<div class="character-list">
<button class="character-card selected" data-character="Personagem 01"><div class="avatar"><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M24 112 Q25 78 38 70 L38 56 62 56 62 70 Q78 78 78 112Z" fill="#b8323e" stroke="#f3c2a0" stroke-width="3"/><ellipse cx="50" cy="38" rx="22" ry="27" fill="#f0c3a0"/><path d="M27 39 Q19 4 52 7 Q84 7 73 43 L65 29 40 25 31 44Z" fill="#542b32"/><circle cx="42" cy="39" r="2.5" fill="#20283a"/><circle cx="59" cy="39" r="2.5" fill="#20283a"/></svg></div><span class="character-name">Personagem 01</span><span class="character-state">Selecionado</span></button>
<button class="character-card" data-character="Personagem 02"><div class="avatar"><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M22 112 Q25 78 38 70 L38 56 62 56 62 70 Q78 78 80 112Z" fill="#315f9d" stroke="#f3c2a0" stroke-width="3"/><ellipse cx="50" cy="38" rx="22" ry="27" fill="#dba77f"/><path d="M26 39 Q22 7 52 8 Q82 7 75 45 L64 27 38 25Z" fill="#202b42"/><circle cx="42" cy="39" r="2.5" fill="#20283a"/><circle cx="59" cy="39" r="2.5" fill="#20283a"/></svg></div><span class="character-name">Personagem 02</span><span class="character-state">Disponível</span></button>
<button class="character-card" data-character="Personagem 03"><div class="avatar"><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M22 112 Q25 78 38 70 L38 56 62 56 62 70 Q78 78 80 112Z" fill="#477d55" stroke="#f3c2a0" stroke-width="3"/><ellipse cx="50" cy="38" rx="22" ry="27" fill="#efc5a4"/><path d="M26 40 Q18 10 48 7 Q83 8 74 45 L65 25 37 28Z" fill="#e6d7bd"/><circle cx="42" cy="39" r="2.5" fill="#20283a"/><circle cx="59" cy="39" r="2.5" fill="#20283a"/></svg></div><span class="character-name">Personagem 03</span><span class="character-state">Disponível</span></button>
<button class="character-card" data-character="Personagem 04"><div class="avatar"><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M22 112 Q25 78 38 70 L38 56 62 56 62 70 Q78 78 80 112Z" fill="#7653a0" stroke="#f3c2a0" stroke-width="3"/><ellipse cx="50" cy="38" rx="22" ry="27" fill="#c98e70"/><path d="M25 40 Q19 7 51 7 Q84 7 75 45 L63 25 37 27Z" fill="#211b2d"/><circle cx="42" cy="39" r="2.5" fill="#20283a"/><circle cx="59" cy="39" r="2.5" fill="#20283a"/></svg></div><span class="character-name">Personagem 04</span><span class="character-state">Disponível</span></button>
</div><div id="selected-character">Selecionado: Personagem 01</div></section>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script>
const statusBox=document.getElementById('status');let hideTimer;
function showMessage(message){statusBox.textContent=message;statusBox.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>statusBox.classList.remove('show'),2400)}
const actions={profile:'Perfil: personalização e estatísticas serão adicionados nesta etapa.',shop:'Loja: sistema de itens será desenvolvido.',start:'O lobby está aberto. A partida Battle Royale ainda está em desenvolvimento.'};
Object.entries(actions).forEach(([id,message])=>document.getElementById(id).addEventListener('click',()=>showMessage(message)));
const characterPanel=document.getElementById('characters-panel');
function openCharacters(){characterPanel.classList.add('open');characterPanel.setAttribute('aria-hidden','false');}
function closeCharacters(){characterPanel.classList.remove('open');characterPanel.setAttribute('aria-hidden','true');}
document.getElementById('characters').addEventListener('click',openCharacters);
document.getElementById('close-characters').addEventListener('click',closeCharacters);
document.querySelectorAll('.character-card').forEach(card=>card.addEventListener('click',()=>{
 document.querySelectorAll('.character-card').forEach(item=>{item.classList.remove('selected');item.querySelector('.character-state').textContent='Disponível';});
 card.classList.add('selected');card.querySelector('.character-state').textContent='Selecionado';
 document.getElementById('selected-character').textContent='Selecionado: '+card.dataset.character;
}));
const petals=document.getElementById('petals');
for(let i=0;i<18;i++){const p=document.createElement('i');p.className='petal';p.style.setProperty('--left',(Math.random()*100)+'%');p.style.setProperty('--duration',(9+Math.random()*12)+'s');p.style.setProperty('--delay',(-Math.random()*18)+'s');p.style.setProperty('--drift',(Math.random()*100-50)+'px');p.style.setProperty('--angle',(Math.random()*180)+'deg');petals.appendChild(p)}
</script>
</body>
</html>
